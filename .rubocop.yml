plugins:
  - rubocop-rails
  - rubocop-rspec

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.4
  SuggestExtensions: false
  Exclude:
    - "bin/**/*"
    - "db/schema.rb"
    - "vendor/**/*"

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/GlobalStdStream:
  Enabled: false

Layout/SpaceInsideArrayLiteralBrackets:
  Enabled: false

Layout/SpaceInsidePercentLiteralDelimiters:
  Enabled: false

Bundler/OrderedGems:
  Enabled: false

Layout/LineLength:
  Exclude:
    - "config/initializers/devise.rb"

Metrics/BlockLength:
  Exclude:
    - "config/environments/*.rb"
    - "spec/**/*"

Metrics/AbcSize:
  Exclude:
    - "db/migrate/*.rb"

Metrics/MethodLength:
  Exclude:
    - "db/migrate/*.rb"

RSpec/MultipleExpectations:
  Max: 8

RSpec/ExampleLength:
  Max: 12

RSpec/DescribeClass:
  Exclude:
    - "spec/tasks/**/*"
    - "spec/requests/**/*"
    - "spec/services/**/*"

Rails/BulkChangeTable:
  Exclude:
    - "db/migrate/*.rb"
