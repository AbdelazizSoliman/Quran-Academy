plugins:
  - rubocop-rails
  - rubocop-rspec

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.4
  SuggestExtensions: false
  Exclude:
    - "bin/**/*"
    - "db/schema.rb"
    - "vendor/**/*"

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/GlobalStdStream:
  Enabled: false

Layout/SpaceInsideArrayLiteralBrackets:
  Enabled: false

Layout/SpaceInsidePercentLiteralDelimiters:
  Enabled: false

Bundler/OrderedGems:
  Enabled: false

Layout/LineLength:
  Exclude:
    - "config/initializers/devise.rb"

Metrics/BlockLength:
  Exclude:
    - "config/environments/*.rb"
    - "config/routes.rb"
    - "db/migrate/*.rb"
    - "spec/**/*"

Metrics/ClassLength:
  Max: 140
  Exclude:
    - "app/models/student_profile.rb"

Metrics/AbcSize:
  Exclude:
    - "db/migrate/*.rb"
    - "app/models/student_profile.rb"
    - "app/queries/admin/guardians_query.rb"

Metrics/MethodLength:
  Exclude:
    - "db/migrate/*.rb"
    - "app/controllers/admin/academy_settings_controller.rb"
    - "spec/requests/admin/academy_settings_spec.rb"
    - "app/queries/admin/students_query.rb"
    - "app/queries/admin/guardians_query.rb"
    - "app/services/admin/guardians/*.rb"
    - "app/services/admin/student_guardianships/*.rb"
    - "app/services/admin/student_profiles/*.rb"
    - "app/services/student/profiles/*.rb"

Metrics/CyclomaticComplexity:
  Exclude:
    - "app/models/student_profile.rb"

Metrics/PerceivedComplexity:
  Exclude:
    - "app/models/student_profile.rb"

Naming/VariableNumber:
  Exclude:
    - "app/controllers/admin/academy_settings_controller.rb"
    - "db/migrate/*.rb"

RSpec/MultipleExpectations:
  Max: 8

RSpec/ExampleLength:
  Max: 12
  Exclude:
    - "spec/requests/admin/academy_settings_spec.rb"
    - "spec/requests/admin/teachers_spec.rb"
    - "spec/requests/teacher/profile_spec.rb"
    - "spec/requests/admin/guardians_spec.rb"
    - "spec/requests/admin/students_spec.rb"
    - "spec/services/guardian_operations_spec.rb"

RSpec/DescribeClass:
  Exclude:
    - "spec/tasks/**/*"
    - "spec/requests/**/*"
    - "spec/services/**/*"
    - "spec/models/student_audit_events_spec.rb"
    - "spec/queries/admin/student_and_guardian_queries_spec.rb"

Rails/SkipsModelValidations:
  Exclude:
    # These atomic updates run under a locked student row and the partial unique index.
    - "app/services/admin/student_guardianships/*.rb"

Rails/BulkChangeTable:
  Exclude:
    - "db/migrate/*.rb"
