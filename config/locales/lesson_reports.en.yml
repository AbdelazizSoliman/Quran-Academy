    errors:
      models:
        lesson_report:
          attributes:
            teacher_profile: { different_teacher: "must match the assigned lesson teacher" }
            base: { ineligible_lesson: "Reports are available only for active or completed lessons", initialization_failed: "Report could not be initialized", forbidden: "You cannot change this report", report_locked: "Report is not editable", stale_record: "Report changed; reload and try again", lesson_not_completed: "Lesson must be completed", attendance_not_locked: "Attendance must be locked", summary_required: "A meaningful lesson summary is required", unresolved_entries: "Complete all expected student entries", invalid_status: "Report is not in the required state", invalid_transition: "Report lifecycle transition is not allowed", reopening_reason_required: "A reopening reason is required" }
        lesson_student_report:
          attributes:
            scheduled_lesson_enrollment: { different_lesson: "must belong to the reported lesson" }
            base: { forbidden: "You cannot change this student report", report_locked: "Report is not editable", stale_record: "Student report changed; reload and try again" }
