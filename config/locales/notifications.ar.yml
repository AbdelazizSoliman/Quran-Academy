      counterpart_teacher: "المعلم"
      counterpart_student: "الطالب"
      account_invitation:
        subject: "دعوة حساب %{academy}"
        body: "السلام عليكم ورحمة الله وبركاته\n\nتم إنشاء حسابك في %{academy}.\n\nلإكمال إنشاء كلمة المرور وتفعيل حسابك، اضغط على الرابط التالي:\n\n%{url}\n\nإذا احتجت أي مساعدة يرجى التواصل مع إدارة الأكاديمية."
      lesson_reminder:
        subject: "تذكير بحلقة %{academy}"
        body: "الأكاديمية: %{academy}\nالمعلم: %{teacher}\nالطالب: %{student}\nالحلقة: %{title}\nالتاريخ: %{date}\nالوقت: %{time}\nالبرنامج: %{program}\nالدورة: %{course}"
      late_reminder:
        subject: "تذكير حضور من %{academy}"
        body: "الأكاديمية: %{academy}\nالمعلم: %{teacher}\nالطالب: %{student}\nلا يزال حضور حلقة %{title} معلقًا.\nالتاريخ: %{date}\nالوقت: %{time}\nالبرنامج: %{program}\nالدورة: %{course}"
      lesson_pre_reminder:
        subject: "تذكير بحلقة %{academy}"
        body: "تبدأ حلقة القرآن بعد 15 دقيقة.\nالمعلم: %{teacher}\nالطالب: %{student}\nالتاريخ: %{date}\nالوقت: %{time}"
      lesson_late_reminder:
        subject: "تذكير تأخر عن حلقة %{academy}"
        body: "بدأت حلقة القرآن منذ 5 دقائق. يرجى الانضمام الآن.\nالمعلم: %{teacher}\nالطالب: %{student}\nالتاريخ: %{date}\nالوقت: %{time}"
      lesson_cancelled:
        subject: "إلغاء حلقة في %{academy}"
        body: "الأكاديمية: %{academy}\nالمعلم: %{teacher}\nالطالب: %{student}\nتم إلغاء الحلقة: %{title}\nالتاريخ: %{date}\nالوقت: %{time}\nالبرنامج: %{program}\nالدورة: %{course}"
      lesson_rescheduled:
        subject: "إعادة جدولة حلقة في %{academy}"
        body: "الأكاديمية: %{academy}\nالمعلم: %{teacher}\nالطالب: %{student}\nتمت إعادة جدولة الحلقة: %{title}\nالتاريخ الجديد: %{date}\nالوقت الجديد: %{time}\nالبرنامج: %{program}\nالدورة: %{course}"
      lesson_report:
        subject: "تقرير حلقة %{academy}"
        body: "الأكاديمية: %{academy}\nالمعلم: %{teacher}\nالطالب: %{student}\nتم نشر تقرير الحلقة: %{title}\nالتاريخ: %{date}\nالوقت: %{time}\nالبرنامج: %{program}\nالدورة: %{course}\n%{url}"
      certificate:
        subject: "شهادة من %{academy}"
        body: "الأكاديمية: %{academy}\nالمعلم: %{teacher}\nالطالب: %{student}\nالشهادة: %{title}\nالتاريخ: %{date}\nالوقت: %{time}\nالبرنامج: %{program}\nالدورة: %{course}\n%{url}"
      invoice_overdue:
        subject: "تذكير بالدفع من %{academy}"
        body: "الأكاديمية: %{academy}\nالطالب: %{student}\nالفاتورة: %{title}\nالمبلغ المستحق: %{amount}\nتاريخ الاستحقاق: %{date}\nيرجى سداد المبلغ في أقرب وقت ممكن."
      invoice_issued:
        subject: "فاتورة من %{academy}"
        body: "الأكاديمية: %{academy}\nالطالب: %{student}\nالفاتورة: %{title}\nالمبلغ المستحق: %{amount}\nتاريخ الاستحقاق: %{date}\nعرض الفاتورة: %{url}"
